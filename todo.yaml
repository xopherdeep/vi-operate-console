# UI Component Optimization
component_optimizations:
  calendar:
    description: "Optimize Calendar component rendering"
    issues:
      - "Heavy re-renders when date selection changes"
      - "Lack of memoization for internal functions"
    solutions:
      - name: "Apply useFastRefreshState for development"
        details: "Use the Fast Refresh state preservation hook during development"
      - name: "Memoize render-intensive components"
        details: "Apply React.memo to prevent unnecessary re-renders"
      - name: "Implement Virtualization for large date ranges"
        details: "Use virtualization for calendars with many months"
    implementation_example: |
      // In calendar.tsx
      import { useFastRefreshState } from '@/lib/utils/fast-refresh';
      
      const Calendar = React.memo(function Calendar({
        className,
        classNames,
        showOutsideDays = true,
        ...props
      }: React.ComponentProps<typeof DayPicker>) {
        // State will persist during development Fast Refresh
        const [currentMonth, setCurrentMonth] = useFastRefreshState(
          new Date(),
          'calendar-current-month'
        );
        
        // Memoize handlers to prevent unnecessary re-renders
        const handleMonthChange = React.useCallback((month) => {
          setCurrentMonth(month);
        }, [setCurrentMonth]);
        
        // ...rest of the component
      });

  data_table:
    description: "Optimize data table rendering performance"
    issues:
      - "Slow rendering with large datasets"
      - "Complex column configurations cause excessive re-renders"
    solutions:
      - "Use virtualized rows for large datasets"
      - "Memoize column definitions"
      - "Implement pagination strategies"
    
  form_components:
    description: "Optimize form component performance"
    issues:
      - "Input components cause excessive re-renders"
      - "Form validation triggers full form re-renders"
    solutions:
      - "Implement controlled components with memoization"
      - "Use form context to prevent unnecessary re-renders"
      - "Split large forms into field-set components"

