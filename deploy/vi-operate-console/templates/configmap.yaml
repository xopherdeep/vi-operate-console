apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vi-operate-console.fullname" . }}-config
  labels:
    {{- include "vi-operate-console.labels" . | nindent 4 }}
data:
  # Basic application configuration
  {{- $nodeEnv := "development" }}
  {{- $appEnv := "dev" }}
  {{- range .Values.config.env }}
    {{- if eq .name "NODE_ENV" }}
      {{- $nodeEnv = .value }}
    {{- else if eq .name "NEXT_PUBLIC_APP_ENV" }}
      {{- $appEnv = .value }}
    {{- end }}
  {{- end }}

  NODE_ENV: {{ $nodeEnv | quote }}
  NEXT_PUBLIC_APP_ENV: {{ $appEnv | quote }}
  PORT: "3000"
  HOSTNAME: "0.0.0.0"

  # Application metadata
  CONSOLE_VERSION: {{ .Chart.AppVersion | quote }}
  ENVIRONMENT: {{ .Values.environment | default "dev" | quote }}

  # Site URL for Next.js
  {{- $siteHost := "localhost:3000" }}
  {{- if .Values.ingress.hosts }}
    {{- $siteHost = (index .Values.ingress.hosts 0).host }}
  {{- end }}
  NEXT_PUBLIC_SITE_URL: "https://{{ $siteHost }}"
