<!-- Add specific responsive utility classes that Storybook has trouble with -->
<style>
  /* Fix for responsive utility classes */
  @media (min-width: 640px) {
    .sm\:static { position: static !important; }
    .sm\:relative { position: relative !important; }
    .sm\:absolute { position: absolute !important; }
    .sm\:sticky { position: sticky !important; }
    .sm\:fixed { position: fixed !important; }
    .sm\:block { display: block !important; }
    .sm\:inline-block { display: inline-block !important; }
    .sm\:flex { display: flex !important; }
    .sm\:grid { display: grid !important; }
    .sm\:hidden { display: none !important; }
  }
  
  /* Fix for border utility classes */
  .border-border { border-color: var(--border) !important; }
  .bg-background { background-color: hsl(var(--background)) !important; }
  .text-foreground { color: hsl(var(--foreground)) !important; }
  
  /* Add more utility classes as needed */
</style>
